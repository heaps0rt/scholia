<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Sign in · Scholia</title>
    <link rel="icon" href="/icon.svg" />
    <link rel="stylesheet" href="/app.css" />
    <script type="module" src="/auth.js"></script>
  </head>
  <body class="sign-in-page">
    <main class="sign-in">
      <img src="/icon.svg" alt="" width="40" height="40" />
      <h1>Your space to understand.</h1>
      <p>Sign in to your private workspaces, readings, and conversations.</p>
      <form id="sign-in">
        <label
          >Email<input
            name="email"
            type="email"
            autocomplete="username"
            required
            autofocus /></label
        ><label
          >Password<input name="password" type="password" autocomplete="current-password" required
        /></label>
        <p id="sign-in-error" role="alert" hidden></p>
        <button class="primary" type="submit">Sign in</button>
      </form>
      <p class="fineprint">
        Need an account or a password reset? Contact the person who runs this Scholia server.
      </p>
    </main>
  </body>
</html>
